<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signing you in · Loyvexa · Loopdesk AI</title>
<link rel="icon" type="image/png" href="/admin/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Loopdesk AI design system */
  body { margin:0; font:15px/1.5 "IBM Plex Sans","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif; background:#f9fafb; color:#111827 }
  .box { max-width:380px; margin:18vh auto; background:#fff; padding:28px; border-radius:20px; border:1px solid #e5e7eb; box-shadow:0 1px 2px rgba(17,24,39,.06); text-align:center }
  .brand { display:inline-flex; align-items:center; gap:10px; font-weight:700 } .brand img { width:36px; height:36px } .brand span { color:#4b5563; font-weight:500 }
  .err { color:#991b1b; background:#fee2e2; border-radius:14px; padding:10px 14px } a { color:#b8142f; font-weight:500 }
</style>
</head>
<body>
<div class="box">
  <p class="brand"><img src="/admin/brand/icon-512.png" alt="">Loopdesk AI <span>/ Loyvexa</span></p>
  <p id="msg">Signing you in…</p>
</div>
<script>
// Single sign-on from the Loopdesk hub: /sso#token=…&next=/admin/
// The token is in the fragment, so it never reaches server logs; it works once.
(async () => {
  const msg = document.getElementById('msg');
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get('token');
  history.replaceState(null, '', location.pathname); // drop the token from the address bar
  if (!token) { msg.innerHTML = 'This sign-in link is incomplete. <a href="/admin/">Log in with email</a>.'; msg.className = 'err'; return; }
  try {
    const res = await fetch('/api/hub/sso/exchange', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error?.message || 'Sign-in failed');
    try {
      localStorage.setItem('wl_admin_token', j.token);
      localStorage.setItem('wl_admin_user', JSON.stringify(j.user));
      localStorage.setItem('wl_admin_tenant', j.user.tenantId || '');
    } catch { throw new Error('Your browser blocked storage. Allow site data for this page and try again.'); }
    location.replace(j.next || '/admin/');
  } catch (e) {
    msg.className = 'err';
    msg.textContent = `${e.message} Go back to your account and press Open Loyvexa again (each link works once, for 1 minute).`;
  }
})();
</script>
</body>
</html>
