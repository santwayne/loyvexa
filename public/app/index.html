<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E85D04">
<link rel="manifest" href="manifest.json">
<title>Rewards</title>
<style>
  :root { --brand:#E85D04; --ink:#1b1b1b; --muted:#6b6b6b; --bg:#f5f4f1; --card:#fff; --ok:#1a7f37; --bad:#c62828; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif; background:var(--bg); color:var(--ink) }
  .wrap { max-width:460px; margin:0 auto; min-height:100vh; padding:18px 16px 96px }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px }
  .brand { font-weight:800; color:var(--brand); font-size:18px }
  .lang { border:1px solid #ddd; background:#fff; border-radius:20px; padding:6px 12px; font-size:13px }
  .card { background:var(--card); border-radius:18px; padding:18px; box-shadow:0 1px 10px rgba(0,0,0,.05); margin-bottom:14px }
  .bal { background:var(--brand); color:#fff }
  .bal .pts { font-size:44px; font-weight:800; line-height:1.1 }
  .bal .sub { opacity:.9; font-size:14px }
  h2 { font-size:17px; margin:0 0 12px }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px }
  input, select { width:100%; font-size:17px; padding:13px 14px; border:1px solid #ddd; border-radius:12px; background:#fff }
  button.primary { width:100%; background:var(--brand); color:#fff; border:0; border-radius:14px; padding:15px; font-size:17px; font-weight:700; margin-top:14px }
  button.ghost { width:100%; background:#fff; color:var(--ink); border:1px solid #ddd; border-radius:14px; padding:13px; font-size:15px; margin-top:10px }
  button:disabled { opacity:.6 }
  .scanbtn { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); width:min(428px,calc(100% - 32px)); background:var(--brand); color:#fff; border:0; border-radius:18px; padding:18px; font-size:19px; font-weight:800; box-shadow:0 6px 20px rgba(0,0,0,.18) }
  .row { display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid #f0f0f0; font-size:15px }
  .row:last-child { border-bottom:0 }
  .plus { color:var(--ok); font-weight:700 } .minus { color:var(--bad); font-weight:700 }
  .muted { color:var(--muted); font-size:13px }
  .err { color:var(--bad); font-size:14px; margin-top:10px; min-height:18px }
  .tabs { display:flex; gap:8px; margin-bottom:14px } .tabs button { flex:1; border:1px solid #ddd; background:#fff; border-radius:12px; padding:10px; font-size:14px }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink) }
  #camWrap { position:fixed; inset:0; background:#000; z-index:20; display:none; flex-direction:column }
  #camWrap video { flex:1; width:100%; object-fit:cover }
  .frame { position:absolute; top:50%; left:50%; width:66vw; max-width:300px; aspect-ratio:1; transform:translate(-50%,-60%); border:3px solid #fff; border-radius:20px; box-shadow:0 0 0 9999px rgba(0,0,0,.45) }
  .camBar { position:absolute; left:0; right:0; bottom:0; padding:18px; display:flex; flex-direction:column; gap:10px }
  .camBar input { background:#fff } .camBar button { margin:0 }
  .result { text-align:center } .result .big { font-size:56px } .result h3 { margin:6px 0; font-size:22px }
  .hidden { display:none !important }
  .tabs button { font-size:13px; padding:10px 4px }
  .scheme { padding:12px 0; border-bottom:1px solid #f0f0f0 } .scheme:last-child { border-bottom:0 }
  .bar { height:8px; background:#eee; border-radius:6px; margin:8px 0; overflow:hidden } .bar div { height:100%; background:var(--brand) }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="brand" id="brandName">…</div><button class="lang" id="langBtn">English</button></header>

  <!-- LOGIN -->
  <section id="vLogin" class="hidden">
    <div class="card">
      <h2 data-t="welcome"></h2>
      <p class="muted" data-t="welcomeSub"></p>
      <div id="stepMobile">
        <label data-t="mobile"></label>
        <input id="mobile" inputmode="numeric" maxlength="13" placeholder="98XXXXXXXX">
        <button class="primary" id="sendOtp" data-t="sendOtp"></button>
      </div>
      <div id="stepOtp" class="hidden">
        <label data-t="otp"></label>
        <input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <div id="newFields" class="hidden">
          <label data-t="name"></label><input id="name">
          <label data-t="iam"></label><select id="ptype"></select>
          <label data-t="city"></label><input id="city">
        </div>
        <p class="muted" id="devOtp"></p>
        <button class="primary" id="verifyOtp" data-t="verify"></button>
      </div>
      <div class="err" id="loginErr"></div>
    </div>
  </section>

  <!-- HOME -->
  <section id="vHome" class="hidden">
    <div class="card bal">
      <div class="sub" data-t="yourPoints"></div>
      <div class="pts" id="balance">0</div>
      <div class="sub" id="rupees"></div>
      <div class="sub" id="held"></div>
    </div>
    <div class="tabs">
      <button class="on" data-tab="hist" data-t="history"></button>
      <button data-tab="schemes" data-t="schemes"></button>
      <button data-tab="redeem" data-t="redeem"></button>
      <button data-tab="profile" data-t="profile"></button>
    </div>
    <div id="tHist" class="card"><div id="ledger"></div></div>
    <div id="tSchemes" class="card hidden"><div id="schemeList"></div></div>
    <div id="tRedeem" class="card hidden">
      <h2 data-t="redeemTitle"></h2>
      <label data-t="upi"></label><input id="upi" placeholder="name@okaxis" autocapitalize="off">
      <label data-t="points"></label><input id="redeemPts" inputmode="numeric">
      <p class="muted" id="redeemHint"></p>
      <button class="primary" id="redeemBtn" data-t="redeemNow"></button>
      <div class="err" id="redeemErr"></div>
      <h2 style="margin-top:18px" data-t="payouts"></h2><div id="redemptions"></div>
    </div>
    <div id="tProfile" class="card hidden">
      <label data-t="name"></label><input id="pName">
      <label data-t="city"></label><input id="pCity">
      <button class="primary" id="saveProfile" data-t="save"></button>
      <button class="ghost" id="logout" data-t="logout"></button>
      <p class="muted" id="pMobile"></p>
    </div>
    <button class="scanbtn" id="openScan" data-t="scan"></button>
  </section>

  <!-- RESULT -->
  <section id="vResult" class="hidden">
    <div class="card result"><div class="big" id="rIcon"></div><h3 id="rTitle"></h3><p id="rMsg"></p>
      <button class="primary" id="scanMore" data-t="scanMore"></button><button class="ghost" id="backHome" data-t="home"></button></div>
  </section>
</div>

<div id="camWrap">
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <div class="camBar">
    <input id="manualCode" placeholder="XXXX-XXXX-XXXX" autocapitalize="characters">
    <button class="primary" id="manualBtn" data-t="submitCode"></button>
    <button class="ghost" id="closeCam" data-t="cancel"></button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
