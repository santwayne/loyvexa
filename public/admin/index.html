<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loyvexa · Brand Console</title>
<style>
  :root { --brand:#E85D04; --ink:#1c1c1c; --muted:#6e6e6e; --line:#ececec; --bg:#f7f6f3; --ok:#1a7f37; --bad:#c62828; --warn:#b26a00 }
  * { box-sizing:border-box } body { margin:0; font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg) }
  .login { max-width:360px; margin:12vh auto; background:#fff; padding:28px; border-radius:16px; box-shadow:0 2px 16px rgba(0,0,0,.06) }
  .login h1 { margin:0 0 4px; font-size:22px } .login p { color:var(--muted); margin:0 0 18px }
  input, select, textarea { width:100%; padding:10px 12px; border:1px solid #ddd; border-radius:10px; font:inherit; background:#fff }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px }
  button { font:inherit; border-radius:10px; padding:9px 14px; border:1px solid #ddd; background:#fff; cursor:pointer }
  button.p { background:var(--brand); border-color:var(--brand); color:#fff; font-weight:600 }
  button.sm { padding:5px 10px; font-size:13px } button.danger { color:var(--bad) }
  .app { display:grid; grid-template-columns:220px 1fr; min-height:100vh }
  nav { background:#151515; color:#ddd; padding:20px 12px } nav .logo { color:#fff; font-weight:800; font-size:18px; padding:0 10px 4px } nav .tenant { color:#999; font-size:12px; padding:0 10px 18px }
  nav a { display:block; padding:9px 10px; border-radius:8px; color:#cfcfcf; text-decoration:none; cursor:pointer } nav a.on, nav a:hover { background:#262626; color:#fff }
  nav .badge { float:right; background:var(--brand); color:#fff; border-radius:10px; padding:0 7px; font-size:12px }
  main { padding:24px 28px; overflow:auto } h2 { margin:0 0 16px; font-size:20px }
  .kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-bottom:18px }
  .kpi { background:#fff; border-radius:14px; padding:14px 16px; border:1px solid var(--line) } .kpi .v { font-size:24px; font-weight:750 } .kpi .l { color:var(--muted); font-size:12px }
  .panel { background:#fff; border-radius:14px; border:1px solid var(--line); padding:16px; margin-bottom:16px }
  .panel h3 { margin:0 0 12px; font-size:15px } .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px }
  table { width:100%; border-collapse:collapse } th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:middle }
  th { font-size:12px; color:var(--muted); font-weight:600 } td.num, th.num { text-align:right; font-variant-numeric:tabular-nums }
  .pill { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; background:#f0f0f0 }
  .pill.ok { background:#e6f4ea; color:var(--ok) } .pill.bad { background:#fdecea; color:var(--bad) } .pill.warn { background:#fff4e0; color:var(--warn) }
  .row { display:flex; gap:10px; align-items:end; flex-wrap:wrap } .row > div { flex:1; min-width:140px }
  .muted { color:var(--muted) } .err { color:var(--bad); margin-top:8px; min-height:18px }
  .bars { display:flex; align-items:flex-end; gap:3px; height:140px; padding-top:8px } .bars div { flex:1; background:var(--brand); border-radius:3px 3px 0 0; min-height:2px; opacity:.85 }
  .hidden { display:none !important }
  .seg { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11.5px; font-weight:600 } .seg.NEW { background:#e8f0fe; color:#1a4fb3 } .seg.REGULAR { background:#e6f4ea; color:#1a7f37 } .seg.HIGH_SPENDER { background:#fff1d6; color:#8a5a00 } .seg.AT_RISK { background:#fff4e0; color:#b26a00 } .seg.DORMANT { background:#fdecea; color:#c62828 }
  .slabrow { display:grid; grid-template-columns:1fr 1fr 1fr 1fr auto; gap:8px; margin-top:8px }
  .key { font-family:ui-monospace,Menlo,monospace; background:#fff8e1; border:1px dashed #e0b000; padding:10px; border-radius:10px; word-break:break-all }
  .chat { max-width:520px; background:#ece5dd; border-radius:12px; padding:12px; height:420px; overflow:auto; display:flex; flex-direction:column; gap:6px }
  .bub { max-width:85%; padding:8px 10px; border-radius:10px; white-space:pre-wrap; font-size:13.5px; box-shadow:0 1px 1px rgba(0,0,0,.08) }
  .bub.in { align-self:flex-end; background:#dcf8c6 } .bub.out { align-self:flex-start; background:#fff }
  code { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; background:#f4f4f4; padding:1px 5px; border-radius:5px }
  pre { background:#f6f6f6; padding:12px; border-radius:10px; overflow:auto; font-size:12.5px }
  @media (max-width:800px) { .app { grid-template-columns:1fr } nav { display:flex; overflow:auto; gap:4px } nav .logo, nav .tenant { display:none } .grid2 { grid-template-columns:1fr } }
</style>
</head>
<body>
<div id="loginView" class="login">
  <h1>Loyvexa</h1><p>Brand console</p>
  <label>Email</label><input id="email" type="email" autocomplete="username">
  <label>Password</label><input id="password" type="password" autocomplete="current-password">
  <button class="p" style="width:100%;margin-top:16px" id="loginBtn">Log in</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="appView" class="app hidden">
  <nav>
    <div class="logo">Loyvexa</div><div class="tenant" id="tenantName"></div>
    <div id="tenantPick" class="hidden" style="padding:0 6px 14px"><select id="tenantSelect"></select></div>
    <a data-v="dashboard" class="on">Dashboard</a>
    <a data-v="products">Products</a>
    <a data-v="qr">QR batches</a>
    <a data-v="participants">Participants</a>
    <a data-v="schemes">Schemes</a>
    <a data-v="invoices">Invoices <span class="badge hidden" id="unmBadge"></span></a>
    <a data-v="connectors">Connectors</a>
    <a data-v="whatsapp">WhatsApp</a>
    <a data-v="segments">Segments</a>
    <a data-v="calls">AI calls</a>
    <a data-v="orders">Orders <span class="badge hidden" id="ordBadge"></span></a>
    <a data-v="campaigns">Campaigns</a>
    <a data-v="redemptions">Redemptions <span class="badge hidden" id="pendBadge"></span></a>
    <a data-v="fraud">Fraud flags <span class="badge hidden" id="fraudBadge"></span></a>
    <a data-v="settings">Settings</a>
    <a id="logoutBtn">Log out</a>
  </nav>
  <main id="main"></main>
</div>
<script src="admin.js"></script>
</body>
</html>
